<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b" />
      <stop offset="50%" stop-color="#09090b" />
      <stop offset="100%" stop-color="#000000" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0.1" />
    </linearGradient>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" stroke="#f59e0b" stroke-width="8" stroke-opacity="0.5" />

  <!-- Outer shield emblem -->
  <path d="M256 64 L416 128 C416 296 256 424 256 424 C256 424 96 296 96 128 Z" fill="url(#shieldGrad)" stroke="url(#goldGrad)" stroke-width="12" stroke-linejoin="round" />

  <!-- Inner Roman / Shield Emblem details -->
  <circle cx="256" cy="220" r="80" fill="#18181b" stroke="url(#goldGrad)" stroke-width="8" />

  <!-- Number 2 with Flame / Crown -->
  <text x="256" y="258" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="110" fill="url(#goldGrad)" text-anchor="middle">2</text>

  <!-- "KVOTA" pill badge -->
  <rect x="156" y="328" width="200" height="42" rx="21" fill="url(#goldGrad)" />
  <text x="256" y="356" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="22" fill="#09090b" text-anchor="middle" letter-spacing="3">KVOTA 2.0</text>
</svg>
